<!DOCTYPE html><html><head><meta charset="utf-8"><title>probe</title>
<script type="importmap">
{"imports":{
  "three":"/node_modules/three/build/three.module.js",
  "three/addons/":"/node_modules/three/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* load a GLB and report its world-space bounding box + a sample of mesh names,
   so the engine placement code can pick the right scale / orientation. */
window.__probe = (url) => new Promise((resolve, reject) => {
  new GLTFLoader().load(url, (g) => {
    const root = g.scene || g.scenes[0];
    root.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3(); box.getSize(size);
    const ctr = new THREE.Vector3(); box.getCenter(ctr);
    const names = []; let meshes = 0;
    root.traverse(o => { if (o.isMesh) { meshes++; if (names.length < 24) names.push(o.name || '(unnamed)'); } });
    resolve({ size:[size.x,size.y,size.z], center:[ctr.x,ctr.y,ctr.z],
              min:[box.min.x,box.min.y,box.min.z], max:[box.max.x,box.max.y,box.max.z],
              meshes, names });
  }, undefined, (e) => reject('load: ' + (e && e.message || e)));
});
window.__ready = true;
</script></head><body>probe</body></html>
